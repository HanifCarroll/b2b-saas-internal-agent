name: Validate and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: switchboard-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Check backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -v

      - name: Check frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run format:check
          npm run build

      - name: Check Worker and D1 bridge
        working-directory: cloudflare
        run: |
          npm run check
          npm run test:storage

      - name: Check repository diff
        run: git diff --check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Apply production D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply switchboard --remote

      - name: Deploy Worker and Container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
